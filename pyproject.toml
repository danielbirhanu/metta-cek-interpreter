[project]
name = "metta-cek-interpreter"
version = "0.1.0"
description = "A deliberately scoped MeTTa-like CEK interpreter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
danielInterpreter = "metta_cek.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
